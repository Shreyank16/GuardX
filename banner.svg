<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GuardX - Real-Time SOC and Threat Telemetry Dashboard" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06121c"/>
      <stop offset="0.55" stop-color="#0b2233"/>
      <stop offset="1" stop-color="#06121c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00e5ff" stroke-opacity="0.07" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="6s" repeatCount="indefinite"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- scanning line -->
    <rect x="0" y="-80" width="1200" height="80" fill="url(#scan)">
      <animate attributeName="y" from="-80" to="320" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- radar + shield -->
    <g transform="translate(170 150)">
      <circle r="105" fill="none" stroke="#00e5ff" stroke-opacity="0.25" stroke-dasharray="4 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle r="82" fill="none" stroke="#7c4dff" stroke-opacity="0.35" stroke-dasharray="30 14">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle r="60" fill="none" stroke="#00e5ff" stroke-width="2">
        <animate attributeName="r" values="60;108" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <path d="M0 -62 L54 -40 V10 C54 42 28 62 0 76 C-28 62 -54 42 -54 10 V-40 Z" fill="#0b2233" stroke="url(#accent)" stroke-width="4" filter="url(#glow)"/>
      <path d="M-24 -4 L-6 16 L26 -22" fill="none" stroke="#00e5ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="90" filter="url(#glow)">
        <animate attributeName="stroke-dashoffset" values="90;0;0;90" keyTimes="0;0.35;0.85;1" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- text -->
    <text x="310" y="160" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="url(#accent)" filter="url(#glow)" letter-spacing="2">GuardX</text>
    <text x="314" y="205" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" fill="#d7f6ff" letter-spacing="1">Real-Time SOC &amp; Threat Telemetry Dashboard</text>
    <text x="314" y="240" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="17" fill="#6fb7c9">Wazuh 4.14.7  •  React 19  •  Express  •  OpenSearch
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
    </text>

    <!-- alert level lights -->
    <g transform="translate(1040 70)" font-family="'SFMono-Regular', Consolas, monospace" font-size="14" fill="#cfe8f0">
      <circle cx="0" cy="0" r="7" fill="#ff1744"><animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/></circle>
      <text x="18" y="5">CRITICAL</text>
      <circle cx="0" cy="30" r="7" fill="#ff9100"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="18" y="35">HIGH</text>
      <circle cx="0" cy="60" r="7" fill="#ffd600"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="18" y="65">MEDIUM</text>
      <circle cx="0" cy="90" r="7" fill="#00e676"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <text x="18" y="95">LOW</text>
    </g>

    <!-- heartbeat line -->
    <path d="M0 292 H180 L200 292 L214 262 L232 322 L250 276 L264 292 H520 L540 292 L554 262 L572 322 L590 276 L604 292 H860 L880 292 L894 262 L912 322 L930 276 L944 292 H1200"
          fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"
          stroke-dasharray="320 1400">
      <animate attributeName="stroke-dashoffset" from="1720" to="0" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="#00e5ff" stroke-opacity="0.35"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
