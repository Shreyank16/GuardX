<svg width="1000" height="440" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GuardX architecture: Browser UI to Express gateway to Wazuh Manager and Indexer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06121c"/><stop offset="1" stop-color="#0b2233"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .box{fill:#0d2a3d;stroke:url(#acc);stroke-width:2}
      .t{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e8fbff;font-size:20px;font-weight:700}
      .s{font-family:'SFMono-Regular',Consolas,monospace;fill:#7fc6d8;font-size:13px}
      .l{font-family:'SFMono-Regular',Consolas,monospace;fill:#9fe9ff;font-size:13px}
      .flow{fill:none;stroke:#00e5ff;stroke-opacity:.55;stroke-width:2;stroke-dasharray:8 8;animation:dash 1.2s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-32}}
    </style>
  </defs>

  <rect width="1000" height="440" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="438" rx="16" fill="none" stroke="#00e5ff" stroke-opacity=".3"/>

  <!-- paths -->
  <path id="p1" class="flow" d="M250 220 H390"/>
  <path id="p2" class="flow" d="M610 220 C670 220 670 110 730 110"/>
  <path id="p3" class="flow" d="M610 220 C670 220 670 330 730 330"/>

  <!-- request packets (forward) -->
  <g filter="url(#glow)">
    <circle r="6" fill="#00e5ff"><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="6" fill="#00e5ff"><animateMotion dur="2s" begin="0.7s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="6" fill="#ffd600"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="6" fill="#ff9100"><animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <!-- response packets (reverse) -->
    <circle r="5" fill="#00e676"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#p2"/></animateMotion></circle>
    <circle r="5" fill="#00e676"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#p3"/></animateMotion></circle>
    <circle r="5" fill="#00e676"><animateMotion dur="2s" begin="1.3s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#p1"/></animateMotion></circle>
  </g>

  <!-- Browser -->
  <rect class="box" x="30" y="160" width="220" height="120" rx="14"/>
  <text class="t" x="140" y="205" text-anchor="middle">GuardX Web UI</text>
  <text class="s" x="140" y="230" text-anchor="middle">Vite · React 19</text>
  <text class="s" x="140" y="252" text-anchor="middle">localhost:5173</text>

  <!-- Gateway -->
  <rect class="box" x="390" y="150" width="220" height="140" rx="14">
    <animate attributeName="stroke-opacity" values="1;.5;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text class="t" x="500" y="190" text-anchor="middle">Backend Gateway</text>
  <text class="s" x="500" y="214" text-anchor="middle">Express · Node.js</text>
  <text class="s" x="500" y="236" text-anchor="middle">127.0.0.1:4000</text>
  <text class="s" x="500" y="258" text-anchor="middle">CA validation · JWT cache</text>

  <!-- Manager -->
  <rect class="box" x="730" y="55" width="240" height="110" rx="14"/>
  <text class="t" x="850" y="97" text-anchor="middle">Wazuh Manager API</text>
  <text class="s" x="850" y="122" text-anchor="middle">v4.14.7 · agents &amp; rules</text>
  <text class="s" x="850" y="144" text-anchor="middle">:55000</text>

  <!-- Indexer -->
  <rect class="box" x="730" y="275" width="240" height="110" rx="14"/>
  <text class="t" x="850" y="317" text-anchor="middle">Wazuh Indexer</text>
  <text class="s" x="850" y="342" text-anchor="middle">OpenSearch 2.x</text>
  <text class="s" x="850" y="364" text-anchor="middle">wazuh-alerts-4.x-* · :9200</text>

  <!-- labels -->
  <text class="l" x="320" y="205" text-anchor="middle">/api/*</text>
  <text class="l" x="688" y="82" text-anchor="middle" transform="translate(0 0)">HTTPS · JWT</text>
  <text class="l" x="688" y="372" text-anchor="middle">HTTPS · Basic</text>

  <!-- legend -->
  <g transform="translate(40 396)" class="s">
    <circle cx="6" cy="0" r="5" fill="#00e5ff"/><text x="18" y="4">request</text>
    <circle cx="106" cy="0" r="5" fill="#00e676"/><text x="118" y="4">response</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
